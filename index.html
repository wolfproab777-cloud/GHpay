<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaClone — Professional Feed</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --border-color: #262626;
      --text-main: #f5f5f5;
      --text-muted: #a8a8a8;
      --accent: #0095f6;
      --like-color: #ff3040;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Asosiy konteyner */
    .app-container {
      width: 100%;
      max-width: 470px;
      padding: 10px;
      margin-bottom: 50px;
    }

    /* Yuqori Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      font-style: italic;
      letter-spacing: -1px;
    }

    .add-post-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal (Post yaratish oyna) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 { margin-bottom: 15px; }
    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #000;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 6px;
    }

    /* Postlar Lentiasi */
    .feed {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
    }

    .avatar img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .username {
      font-weight: 600;
      font-size: 14px;
    }

    .post-img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .post-actions {
      padding: 10px 12px 5px;
      display: flex;
      gap: 15px;
    }

    .action-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .action-btn.liked { color: var(--like-color); }

    .post-likes {
      padding: 0 12px;
      font-weight: 600;
      font-size: 13px;
    }

    .post-caption {
      padding: 5px 12px;
      font-size: 14px;
    }

    .post-caption span { font-weight: 600; margin-right: 5px; }

    /* Izohlar */
    .comments-section {
      padding: 5px 12px 12px;
    }

    .comment-item {
      font-size: 13px;
      margin-top: 3px;
      color: var(--text-muted);
    }

    .comment-input-box {
      display: flex;
      border-top: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .comment-input-box input {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 12px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .comment-input-box button {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 600;
      padding: 0 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">InstaClone</div>
      <button class="add-post-btn" id="openModalBtn">+ Post</button>
    </header>

    <!-- Modal: Yangi post yaratish -->
    <div class="modal" id="postModal">
      <div class="modal-content">
        <h3>Yangi Post Yaratish</h3>
        <input type="text" id="authorInput" placeholder="Ismingiz (username)">
        <input type="file" id="imageInput" accept="image/*">
        <textarea id="captionInput" placeholder="Rasm haqida matn..." rows="3"></textarea>
        <button class="add-post-btn" id="submitPostBtn" style="width: 100%;">Ulashish</button>
      </div>
    </div>

    <!-- Feed (Lenta) -->
    <div class="feed" id="feedContainer"></div>
  </div>

  <script>
    // Boshlang'ich ma'lumotlar (Demo Data)
    let posts = [
      {
        id: 1,
        author: "ali_coder",
        avatar: "https://i.pravatar.cc/150?img=11",
        image: "https://picsum.photos/600/600?random=1",
        caption: "Toshkentda ajoyib kun! ☀️ #nature #uzb",
        likes: 12,
        isLiked: false,
        comments: ["Zo'r rasm!", "Chiroyli chiqibdi"]
      }
    ];

    const feedContainer = document.getElementById('feedContainer');
    const openModalBtn = document.getElementById('openModalBtn');
    const postModal = document.getElementById('postModal');
    const submitPostBtn = document.getElementById('submitPostBtn');

    // Postlarni ekranga chiqarish
    function renderPosts() {
      feedContainer.innerHTML = '';
      posts.forEach(post => {
        const postElement = document.createElement('div');
        postElement.classList.add('post-card');
        postElement.innerHTML = `
          <div class="post-header">
            <div class="avatar"><img src="${post.avatar}" alt="avatar"></div>
            <div class="username">${post.author}</div>
          </div>
          <img src="${post.image}" class="post-img" alt="post">
          <div class="post-actions">
            <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
              ${post.isLiked ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="post-likes">${post.likes} ta layk</div>
          <div class="post-caption"><span>${post.author}</span>${post.caption}</div>
          
          <div class="comments-section">
            ${post.comments.map(c => `<div class="comment-item"><b>Foydalanuvchi:</b> ${c}</div>`).join('')}
            <div class="comment-input-box">
              <input type="text" placeholder="Izoh qoldiring..." id="comment-input-${post.id}">
              <button onclick="addComment(${post.id})">Joylash</button>
            </div>
          </div>
        `;
        feedContainer.appendChild(postElement);
      });
    }

    // Layk bosish mantiqi
    function toggleLike(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        post.isLiked = !post.isLiked;
        post.likes += post.isLiked ? 1 : -1;
        renderPosts();
      }
    }

    // Izoh qo'shish mantiqi
    function addComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      if (input.value.trim() !== '') {
        const post = posts.find(p => p.id === id);
        post.comments.push(input.value.trim());
        input.value = '';
        renderPosts();
      }
    }

    // Modal oynani ochish/yopish
    openModalBtn.onclick = () => postModal.style.display = 'flex';
    window.onclick = (e) => { if (e.target === postModal) postModal.style.display = 'none'; };

    // Yangi post yaratish
    submitPostBtn.onclick = () => {
      const author = document.getElementById('authorInput').value || 'noma_lum';
      const caption = document.getElementById('captionInput').value;
      const imageFile = document.getElementById('imageInput').files[0];

      if (!imageFile) {
        alert("Iltimos, rasm tanlang!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const newPost = {
          id: Date.now(),
          author: author,
          avatar: "https://i.pravatar.cc/150?img=33",
          image: e.target.result,
          caption: caption,
          likes: 0,
          isLiked: false,
          comments: []
        };
        posts.unshift(newPost);
        renderPosts();
        postModal.style.display = 'none';
      };
      reader.readAsDataURL(imageFile);
    };

    // Boshlanishida chiqarish
    renderPosts();
  </script>
</body>
</html>
