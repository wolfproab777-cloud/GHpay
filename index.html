<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Parol Topuvchi</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #00ff00;
            /* MUHIM O'ZGARISH: height ni 100vh ga o'zgartirdim */
            height: 100vh; 
            margin: 0;
            
            /* Markazlashtirish uchun Flexbox */
            display: flex;
            justify-content: center; /* Gorizontal markaz */
            align-items: center;     /* Vertikal markaz */
        }

        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            width: 400px;
            text-align: center;
            border: 1px solid #00ff00;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #00ff00;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        button {
            width: 90%;
            padding: 12px;
            background-color: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00cc00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 30px;
            color: #aaa;
        }

        /* Parol ko'rsatish joyi */
        #passwordDisplay {
            margin-top: 25px;
            font-size: 32px;
            letter-spacing: 8px;
            min-height: 40px;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #444;
        }

        .current-char {
            color: #ffff00; /* Sariq rang - hozir tanlanayotgan harf */
            font-weight: bold;
            animation: blink 0.1s infinite;
        }

        .success-text {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Parol Topish</h2>
    <input type="text" id="nikName" placeholder="Nick nomini kiriting..." autocomplete="off">
    <button onclick="startFinding()" id="btnStart">Topishni Boshlash</button>

    <div id="status">Status: Tayyor...</div>
    
    <!-- Parol shu yerda chiqadi -->
    <div id="passwordDisplay"></div>
</div>

<script>
    let isRunning = false;

    function startFinding() {
        const nikInput = document.getElementById('nikName');
        const nik = nikInput.value.trim();
        const btn = document.getElementById('btnStart');
        const statusDiv = document.getElementById('status');
        const passwordDisplay = document.getElementById('passwordDisplay');

        if (!nik) {
            alert("Iltimos, Nick nomini kiriting!");
            return;
        }

        if (isRunning) return;
        
        // Jarayonni boshlash holati
        isRunning = true;
        btn.disabled = true;
        btn.innerText = "Kutilmoqda...";
        passwordDisplay.innerHTML = "";
        statusDiv.innerHTML = `${nik} hisobi tekshirilmoqda...`;

        // Simulyatsiya: Birinchi urinishdan oldin kichik kutish
        setTimeout(() => {
            findPassword(nik);
        }, 800);
    }

    async function findPassword(nik) {
        const passwordDisplay = document.getElementById('passwordDisplay');
        const statusDiv = document.getElementById('status');
        
        // Parol uzunligi (masalan, 6 ta belgi)
        const passwordLength = 6; 
        let currentPassword = "";

        // Har bir xonani topish sikli
        for (let i = 0; i < passwordLength; i++) {
            statusDiv.innerHTML = `${nik}... ${i+1}-harf topilmoqda...`;
            
            let foundChar = false;
            // Katta harflar, kichik harflar va raqamlar
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            
            while (!foundChar) {
                // Tasodifiy belgi tanlash
                const randomIndex = Math.floor(Math.random() * chars.length);
                const tempChar = chars[randomIndex];
                
                // Ekranda ko'rsatish (tez o'zgaruvchi effekt)
                passwordDisplay.innerHTML = currentPassword + `<span class="current-char">${tempChar}</span>`;
                
                // Tasodifiy vaqt kutish (harf yoki raqam ekanligini bilmaslik effekti)
                await new Promise(r => setTimeout(r, 50)); 

                // Ehtimollik: Agar tasodifiy son 0.7 dan katta bo'lsa, bu harf "to'g'ri" deb qabul qilinadi
                if (Math.random() > 0.6) {
                    currentPassword += tempChar;
                    foundChar = true;
                    
                    // Harf topilganda ozgina to'xtash
                    await new Promise(r => setTimeout(r, 150));
                }
            }
        }

        // Yakuniy natija
        statusDiv.innerHTML = `<span style="color:#00ff00; font-weight:bold;">Muvaffaqiyatli! Parol topildi.</span>`;
        
        // Ekrandagi oxirgi belgini ham o'zgartirib, yakuniy parolni ko'rsatish
        passwordDisplay.innerHTML = `<span class="success-text">${currentPassword}</span> ✅`;
        
        isRunning = false;
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStart').innerText = "Topishni Boshlash";
    }
</script>

</body>
</html>
