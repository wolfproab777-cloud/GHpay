<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghpat — Modern Social Network</title>
  <style>
    :root {
      --bg-main: #0a0a0c;
      --card-bg: #141418;
      --border-color: #26262e;
      --text-main: #ffffff;
      --text-muted: #9a9ab0;
      --accent-gradient: linear-gradient(135deg, #8a2be2, #00d2ff);
      --like-color: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Markaziy Konteyner */
    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 0 10px;
    }

    /* Header Navigatsiya */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 12px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: rgba(10, 10, 12, 0.9);
      backdrop-filter: blur(12px);
      z-index: 50;
    }

    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .btn-create {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
      transition: transform 0.2s;
    }

    .btn-create:active {
      transform: scale(0.95);
    }

    /* Modal / Yaratish Oynasi */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .input-field, .textarea-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #000000;
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: #8a2be2;
    }

    /* Postlar Lentasining Stili */
    .feed {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .post {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-gradient);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .username {
      font-weight: 600;
      font-size: 14px;
    }

    .post-image-box {
      width: 100%;
      max-height: 520px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .post-image {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
    }

    .post-actions {
      padding: 12px 16px 6px;
      display: flex;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: scale(1.2);
    }

    .icon-btn.liked {
      color: var(--like-color);
    }

    .likes-count {
      padding: 0 16px;
      font-weight: 600;
      font-size: 13px;
    }

    .caption-box {
      padding: 6px 16px 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .caption-box .author {
      font-weight: 700;
      margin-right: 6px;
    }

    /* Izohlar Sektsiyasi */
    .comments-wrapper {
      padding: 0 16px 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 6px;
    }

    .comment-line {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .comment-line b {
      color: var(--text-main);
    }

    .add-comment-form {
      display: flex;
      margin-top: 10px;
      gap: 8px;
    }

    .add-comment-form input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      color: white;
      padding: 6px 0;
      font-size: 13px;
      outline: none;
    }

    .add-comment-form button {
      background: none;
      border: none;
      color: #00d2ff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="brand-logo">Ghpat</div>
      <button class="btn-create" id="openModalBtn">+ Yaratish</button>
    </header>

    <!-- Post Yaratish Modali -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card">
        <h3>Yangi Post Yaratish</h3>
        <input type="text" class="input-field" id="authorInput" placeholder="Sizning nikeringiz (username)">
        <input type="file" class="input-field" id="imageFileInput" accept="image/*">
        <textarea class="textarea-field" id="captionInput" placeholder="Post uchun matn yozing..." rows="3"></textarea>
        <div style="display: flex; gap: 10px;">
          <button class="btn-create" id="publishBtn" style="flex: 1;">Chiqarish</button>
          <button class="btn-create" id="closeModalBtn" style="background: #333; flex: 1;">Bekor qilish</button>
        </div>
      </div>
    </div>

    <!-- Feed / Lenta -->
    <div class="feed" id="feedContainer"></div>
  </div>

  <script>
    // Boshlang'ich va saqlangan postlar
    let posts = JSON.parse(localStorage.getItem('ghpat_posts')) || [
      {
        id: 101,
        author: "ghpat_official",
        avatar: "https://i.pravatar.cc/150?img=60",
        image: "https://picsum.photos/600/600?random=10",
        caption: "Ghpat ijtimoiy tarmog'iga xush kelibsiz! 🚀 Birinchi postni joylang.",
        likes: 24,
        isLiked: false,
        comments: ["Loyihaga omad!", "Dizayn juda dahliz chiqqan 🔥"]
      }
    ];

    const feedContainer = document.getElementById('feedContainer');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const publishBtn = document.getElementById('publishBtn');

    // Postlarni brauzer xotirasiga saqlash
    function savePosts() {
      localStorage.setItem('ghpat_posts', JSON.stringify(posts));
    }

    // Postlarni ekranga chiqarish (Render)
    function renderFeed() {
      feedContainer.innerHTML = '';
      posts.forEach(post => {
        const postCard = document.createElement('article');
        postCard.className = 'post';
        postCard.innerHTML = `
          <div class="post-header">
            <div class="user-avatar">
              <img src="${post.avatar}" alt="user avatar">
            </div>
            <div class="username">${post.author}</div>
          </div>

          <div class="post-image-box">
            <img src="${post.image}" class="post-image" alt="post content">
          </div>

          <div class="post-actions">
            <button class="icon-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
              ${post.isLiked ? '❤️' : '🤍'}
            </button>
          </div>

          <div class="likes-count">${post.likes} ta yoqtirishlar</div>

          <div class="caption-box">
            <span class="author">${post.author}</span>${post.caption}
          </div>

          <div class="comments-wrapper">
            ${post.comments.map(c => `<div class="comment-line"><b>Foydalanuvchi:</b> ${c}</div>`).join('')}
            <div class="add-comment-form">
              <input type="text" placeholder="Izoh qoldiring..." id="comment-input-${post.id}">
              <button onclick="submitComment(${post.id})">Yuborish</button>
            </div>
          </div>
        `;
        feedContainer.appendChild(postCard);
      });
    }

    // Layk/Reaksiya funksiyasi
    function toggleLike(id) {
      const post = posts.find(p => p.id === id);
      if (post) {
        post.isLiked = !post.isLiked;
        post.likes += post.isLiked ? 1 : -1;
        savePosts();
        renderFeed();
      }
    }

    // Izoh yuborish
    function submitComment(id) {
      const input = document.getElementById(`comment-input-${id}`);
      const val = input.value.trim();
      if (val) {
        const post = posts.find(p => p.id === id);
        post.comments.push(val);
        savePosts();
        renderFeed();
      }
    }

    // Modallarni boshqarish
    openModalBtn.onclick = () => modalOverlay.style.display = 'flex';
    closeModalBtn.onclick = () => modalOverlay.style.display = 'none';

    // Yangi rasm/post joylash
    publishBtn.onclick = () => {
      const author = document.getElementById('authorInput').value.trim() || 'user_' + Math.floor(Math.random() * 1000);
      const caption = document.getElementById('captionInput').value.trim();
      const fileInput = document.getElementById('imageFileInput').files[0];

      if (!fileInput) {
        alert("Iltimos, biror rasm tanlang!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const newPost = {
          id: Date.now(),
          author: author,
          avatar: "https://i.pravatar.cc/150?img=" + Math.floor(Math.random() * 50),
          image: e.target.result,
          caption: caption,
          likes: 0,
          isLiked: false,
          comments: []
        };

        posts.unshift(newPost);
        savePosts();
        renderFeed();

        // Formalarni tozalash va yopish
        document.getElementById('captionInput').value = '';
        document.getElementById('imageFileInput').value = '';
        modalOverlay.style.display = 'none';
      };

      reader.readAsDataURL(fileInput);
    };

    // Boshlanishida ishga tushirish
    renderFeed();
  </script>
</body>
</html>
