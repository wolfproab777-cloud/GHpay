<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Nick Checker & Token</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #1a1a1a;
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
            border: 1px solid #333;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h2 {
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 2px solid #333;
            color: #fff;
            font-size: 16px;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00ff88;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* Natija oynasi */
        #resultArea {
            margin-top: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .status-msg {
            font-size: 14px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .token-display {
            background: #222;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            word-break: break-all;
            font-family: monospace;
            color: #fff;
            display: none; /* Boshida yashirin */
            border: 1px dashed #00ff88;
        }

        /* Animatsiyalar */
        .checking {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .error-text {
            color: #ff4444;
            font-weight: bold;
            font-size: 18px;
        }

        .success-text {
            color: #00ff88;
            font-weight: bold;
            font-size: 18px;
        }

    </style>
</head>
<body>

<div class="card">
    <h2>Nik Checker & Token</h2>
    
    <div class="input-box">
        <input type="text" id="nikInput" placeholder="Roblox nickini yozing..." autocomplete="off">
    </div>

    <button onclick="checkAndLogin()" id="btnCheck">Tekshirish va Kirish</button>

    <div id="resultArea">
        <div class="status-msg" id="statusMsg">Nick nomini kuting...</div>
        <div class="token-display" id="tokenOutput"></div>
    </div>
</div>

<script>
    // 1. "Real" deb hisoblanadigan niklar ro'yxati (Simulyatsiya uchun)
    // Haqiqiy API ulansa, bu barcha niklarni qidiradi. Hozircha shularni topadi:
    const knownRobloxNicks = [
        "Roblox", 
        "BaconLord", 
        "Guest99", 
        "NoobMaster69", 
        "Builderman", 
        "RocketRico", 
        "Dantheman",
        "MegaBloxxer"
    ];

    async function checkAndLogin() {
        const input = document.getElementById('nikInput');
        const btn = document.getElementById('btnCheck');
        const statusMsg = document.getElementById('statusMsg');
        const tokenOutput = document.getElementById('tokenOutput');
        
        let nick = input.value.trim();

        if (!nick) {
            alert("Iltimos, nick nomini kiriting!");
            return;
        }

        // UI ni tozalash va yuklanish holatiga o'tkazish
        btn.disabled = true;
        btn.innerText = "Qidirilmoqda...";
        tokenOutput.style.display = 'none';
        statusMsg.className = 'status-msg checking';
        statusMsg.innerText = `${nick} Roblox bazasida qidirilmoqda...`;

        // Simulyatsiya: Serverga so'rov ketayotgandek kutish (1.5 soniya)
        await new Promise(r => setTimeout(r, 1500));

        // 2. Nik mavjudligini tekshirish logikasi
        // Haqiqiy dunyoda bu yerda API chaqiriladi. Biz esa `knownRobloxNicks` ichida qidiramiz.
        
        let found = false;
        
        // Kichik harf va katta harf farqini yo'qotish uchun (case-insensitive)
        const lowerNick = nick.toLowerCase();
        
        // Tekshirish sikli
        for (let i = 0; i < knownRobloxNicks.length; i++) {
            if (knownRobloxNicks[i].toLowerCase() === lowerNick) {
                found = true;
                break;
            }
        }

        // Agar natija bo'lsa:
        if (found) {
            statusMsg.className = 'status-msg success-text';
            statusMsg.innerText = "✅ Nik topildi! Token generatsiya qilinmoqda...";
            
            await new Promise(r => setTimeout(r, 1000)); // Token chiqishini kutish

            // Token yaratish
            const token = `rbx_auth_${nick}_${Math.random().toString(36).substr(2)}_${Date.now()}`;
            
            tokenOutput.style.display = 'block';
            tokenOutput.innerText = token;
            
            btn.disabled = false;
            btn.innerText = "Qayta tekshirish";

        } else {
            // Agar natija bo'lmasa:
            statusMsg.className = 'status-msg error-text';
            statusMsg.innerText = `❌ "${nick}" Robloxda yo'q!`;
            
            btn.disabled = false;
            btn.innerText = "Tekshirish va Kirish";
        }
    }
</script>

</body>
</html>
