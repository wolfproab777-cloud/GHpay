<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Auto-Login Script</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
            border: 1px solid #333;
            position: relative;
        }

        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00ff88;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        /* Status Panel */
        #statusPanel {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success Overlay (Kirgandan keyin chiqadigan ekran) */
        #successOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 10;
        }

        #successOverlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-text {
            color: #00ff88;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .token-box {
            background: #222;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            color: #fff;
            margin-top: 10px;
            word-break: break-all;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Kirish oynasi -->
    <div id="loginForm">
        <h2>Auto Login</h2>
        <div class="input-group">
            <input type="text" id="nikName" placeholder="Nick nomini kiriting..." autocomplete="off">
        </div>
        <!-- Parol shart emas, lekin ko'rinishi uchun qoldirdim -->
        <div class="input-group">
            <input type="password" id="passField" placeholder="Parol (avtomatik)..." disabled style="opacity: 0.5;">
        </div>
        
        <button onclick="autoLogin()" id="btnLogin">Tizimga Kirish</button>
        
        <div class="spinner" id="loader"></div>
        <div id="statusPanel">Kutib turilmoqda...</div>
    </div>

    <!-- Muvaffaqiyatli kirgandan keyin chiqadigan qism -->
    <div id="successOverlay">
        <div class="success-text">✅ Tizimga kirdingiz!</div>
        <div style="font-size: 14px; color: #aaa;">Sizning Token:</div>
        <div class="token-box" id="tokenDisplay">Loading token...</div>
        <button onclick="reset()" style="margin-top: 20px; width: 80%; background: #333; color: #fff;">Chiqish</button>
    </div>
</div>

<script>
    async function autoLogin() {
        const nik = document.getElementById('nikName').value.trim();
        const btn = document.getElementById('btnLogin');
        const status = document.getElementById('statusPanel');
        const loader = document.getElementById('loader');
        const passField = document.getElementById('passField');

        if (!nik) {
            alert("Nick nomini kiriting!");
            return;
        }

        // 1. UI ni yuklanish holatiga o'tkazish
        btn.disabled = true;
        btn.innerText = "Tekshirilmoqda...";
        loader.style.display = "block";
        status.innerHTML = `Serverga ulanish: <span style="color:#00ff88">${nik}</span>`;
        
        // Parol maydonini to'ldirish effekti
        passField.value = "";
        let typingEffect = "";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$";
        
        // Simulyatsiya: Parolni o'zi yozib qo'yayotgandek qilish
        for(let i=0; i<15; i++) {
            typingEffect += chars[Math.floor(Math.random() * chars.length)];
            passField.value = typingEffect;
            await new Promise(r => setTimeout(r, 50));
        }

        // 2. Serverdan javob kutish simulyatsiyasi
        status.innerHTML = "Autentifikatsiya...";
        await new Promise(r => setTimeout(r, 1000));
        
        status.innerHTML = "Token olinmoqda...";
        await new Promise(r => setTimeout(r, 800));

        // 3. Muvaffaqiyatli kirish
        loader.style.display = "none";
        btn.innerText = "Kirildi!";
        
        // Token generatsiya qilish
        const token = "rbx_auth_" + Math.random().toString(36).substr(2) + Date.now();
        
        // Overlayni ko'rsatish
        document.getElementById('successOverlay').classList.add('active');
        document.getElementById('tokenDisplay').innerText = token;
    }

    function reset() {
        document.getElementById('successOverlay').classList.remove('active');
        document.getElementById('btnLogin').disabled = false;
        document.getElementById('btnLogin').innerText = "Tizimga Kirish";
        document.getElementById('statusPanel').innerText = "Kutib turilmoqda...";
        document.getElementById('nikName').value = "";
        document.getElementById('passField').value = "";
    }
</script>

</body>
</html>
