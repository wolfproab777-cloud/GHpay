<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghpat Social Platform</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --border: #262626;
      --accent: #0095f6;
      --text: #ffffff;
      --text-muted: #a8a8a8;
      --error: #ed4956;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 450px; background: var(--bg); position: relative; display: flex; flex-direction: column; min-height: 100vh; border-x: 1px solid var(--border); }

    .page { display: none; flex-direction: column; flex: 1; padding: 15px; padding-bottom: 70px; }
    .page.active { display: flex; }

    /* Kirish oynasi */
    .auth-box { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
    .google-btn { background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    input { width: 100%; padding: 12px; background: #121212; border: 1px solid var(--border); border-radius: 6px; color: #fff; outline: none; }
    input.error { border-color: var(--error); }
    .btn-main { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .error-text { color: var(--error); font-size: 13px; min-height: 18px; }

    /* Google Account Choice Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; justify-content: center; align-items: center; }
    .google-modal { background: #fff; color: #000; border-radius: 12px; width: 90%; max-width: 360px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .acc-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; cursor: pointer; }
    .acc-avatar { width: 36px; height: 36px; border-radius: 50%; background: #0095f6; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* Header & Navbar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .add-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; display: flex; flex-direction: column; align-items: center; }
    .nav-btn.active { color: #fff; }

    /* Profil Instagram uslubida */
    .profile-header { display: flex; align-items: center; gap: 20px; padding: 15px 0; }
    .avatar-circle { width: 80px; height: 80px; border-radius: 50%; border: 1px solid var(--border); background: #262626; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    
    .stats-container { display: flex; gap: 15px; text-align: center; }
    .stat-box { cursor: pointer; }
    .stat-num { font-weight: bold; font-size: 16px; }
    .stat-label { font-size: 12px; color: var(--text-muted); }

    .action-btn { width: 100%; padding: 8px; border-radius: 8px; background: #262626; color: #fff; border: none; font-weight: 600; margin-top: 10px; }
    .action-btn.disabled { opacity: 0.6; cursor: not-allowed; }

    /* Grid (Postlar va Reels) */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 15px; }
    .grid-item { aspect-ratio: 1; background: #181818; position: relative; cursor: pointer; }
    .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
    .media-type-icon { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 4px; font-size: 10px; }

    /* Overlay Full View (Instagram Feed Modal) */
    .full-view-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 300; flex-direction: column; overflow-y: auto; }
    .post-card { border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .post-head { display: flex; align-items: center; gap: 10px; padding: 10px; }
    .post-head img { width: 32px; height: 32px; border-radius: 50%; }
    .post-media { width: 100%; max-height: 450px; background: #111; object-fit: contain; }
    .post-actions { padding: 10px; display: flex; gap: 15px; font-size: 20px; }
    .like-btn { cursor: pointer; }
    .like-btn.liked { color: var(--error); }
    .comments-section { padding: 0 10px 10px; font-size: 14px; }

    /* Creation Modal & Progress */
    .create-menu { display: none; position: fixed; bottom: 0; width: 100%; max-width: 450px; background: var(--card-bg); border-top-left-radius: 15px; border-top-right-radius: 15px; padding: 20px; z-index: 150; }
    .progress-bar { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 10px; display: none; }
    .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s; }
  </style>
</head>
<body>

  <div class="app">

    <!-- GOOGLE ACCOUNT CHOOSE MODAL -->
    <div class="modal-overlay" id="googleModal">
      <div class="google-modal">
        <h3 style="margin-bottom: 15px; font-size: 16px;">Akkauntni tanlang</h3>
        <div class="acc-item" onclick="selectGoogleAcc('wolfproab777@gmail.com')">
          <div class="acc-avatar">W</div>
          <div>
            <strong>WOLFPRO</strong><br>
            <span style="font-size:12px; color:#666;">wolfproab777@gmail.com</span>
          </div>
        </div>
        <div class="acc-item" onclick="selectGoogleAcc('oxidepro980@gmail.com')">
          <div class="acc-avatar" style="background:#e91e63;">O</div>
          <div>
            <strong>OXIDE PRO</strong><br>
            <span style="font-size:12px; color:#666;">oxidepro980@gmail.com</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PAGE 1: KIRISH (LOGIN) -->
    <div class="page active" id="page-login">
      <h2 style="text-align: center; margin-top: 40px; font-size: 28px;">Ghpat</h2>
      <div class="auth-box">
        <button class="google-btn" id="googleBtn">
          <span>G</span> Google orqali kirish
        </button>
        <div style="text-align: center; color: var(--text-muted); font-size: 12px;">YOKI</div>
        <input type="text" id="loginNick" placeholder="Nik (Username)">
        <input type="password" id="loginPass" placeholder="Parol">
        <div class="error-text" id="loginError"></div>
        <button class="btn-main" id="loginBtn">Kirish</button>
      </div>
    </div>

    <!-- PAGE 2: PROFIL (INSTAGRAM STYLE) -->
    <div class="page" id="page-profile">
      <div class="top-bar">
        <span id="headerNick" style="font-weight: bold; font-size: 18px;">nik</span>
        <button class="add-btn" onclick="openCreateMenu()">+</button>
      </div>

      <div class="profile-header">
        <div class="avatar-circle">
          <img id="myAvatar" src="" alt="" style="display:none;">
        </div>
        
        <div style="flex:1;">
          <div class="stats-container">
            <div class="stat-box">
              <div class="stat-num" id="postsCount">0</div>
              <div class="stat-label">Postlar</div>
            </div>
            <div class="stat-box" onclick="alert('Obunachilar ro\'yxati')">
              <div class="stat-num" id="followersCount">0</div>
              <div class="stat-label">Obunachilar</div>
            </div>
            <div class="stat-box" onclick="alert('Obunalar ro\'yxati')">
              <div class="stat-num" id="followingCount">0</div>
              <div class="stat-label">Obunalar</div>
            </div>
          </div>
          <button class="action-btn disabled" id="followBtn" disabled>Obuna bo'lish</button>
        </div>
      </div>

      <!-- POSTLAR VA REELS GRID -->
      <div class="grid" id="profileGrid"></div>
    </div>

    <!-- PAGE 3: REELS SAHIFASI -->
    <div class="page" id="page-reels">
      <div class="top-bar">
        <span style="font-weight: bold; font-size: 18px;">Reels</span>
      </div>
      <div id="reelsFeed" style="margin-top: 10px;"></div>
    </div>

    <!-- MEDIA CREATION MENU -->
    <div class="create-menu" id="createMenu">
      <h3 style="margin-bottom: 10px;">Yangi Material Yaratish</h3>
      <select id="mediaType" style="width:100%; padding: 10px; background:#000; color:#fff; margin-bottom:10px;">
        <option value="post">Post (Faqat Rasm)</option>
        <option value="reels">Reels (Faqat Video)</option>
      </select>
      <input type="file" id="mediaFile" accept="image/*,video/*" style="margin-bottom: 10px;">
      <input type="text" id="mediaCaption" placeholder="Izoh yozing..." style="margin-bottom: 10px;">
      
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div id="progressText" style="text-align:center; font-size:12px; margin: 5px 0;"></div>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-main" style="flex:1;" onclick="startGeneration()">Bo'ldi</button>
        <button class="btn-main" style="flex:1; background:#333;" onclick="closeCreateMenu()">Yopish</button>
      </div>
    </div>

    <!-- FULL MEDIA VIEW MODAL (POST VIEW) -->
    <div class="full-view-modal" id="fullViewModal">
      <button onclick="closeFullView()" style="background:none; border:none; color:#fff; font-size:24px; padding:10px; text-align:left;">✕</button>
      <div id="fullViewContent"></div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="bottom-nav" id="bottomNav" style="display: none;">
      <button class="nav-btn active" id="navProfileBtn" onclick="switchPage('profile')">👤 Profil</button>
      <button class="nav-btn" id="navReelsBtn" onclick="switchPage('reels')">🎬 Reels</button>
    </div>

  </div>

  <script>
    // Xotirada saqlangan foydalanuvchilar va postlar database simulyatsiyasi
    const db = {
      users: {
        "wolfproab777@gmail.com": { nick: "WOLFPRO", pass: "123456789", avatar: "" },
        "oxidepro980@gmail.com": { nick: "OXIDEPRO", pass: "987654321", avatar: "" }
      },
      currentUser: null,
      posts: [], // { id, user, type: 'post'|'reels', url, caption, likes: 0, comments: [], views: 0 }
    };

    // Google tugmasi modalni ochadi
    document.getElementById('googleBtn').onclick = () => {
      document.getElementById('googleModal').style.display = 'flex';
    };

    function selectGoogleAcc(email) {
      document.getElementById('googleModal').style.display = 'none';
      const user = db.users[email];
      if (user) {
        document.getElementById('loginNick').value = user.nick;
        document.getElementById('loginPass').value = user.pass;
      }
    }

    // Kirish tugmasi mantiqi
    document.getElementById('loginBtn').onclick = () => {
      const nickInput = document.getElementById('loginNick');
      const passInput = document.getElementById('loginPass');
      const errDiv = document.getElementById('loginError');

      nickInput.classList.remove('error');
      passInput.classList.remove('error');
      errDiv.innerText = '';

      let foundUser = Object.values(db.users).find(u => u.nick.toLowerCase() === nickInput.value.toLowerCase());

      if (!foundUser) {
        nickInput.classList.add('error');
        errDiv.innerText = "Nik noto'g'ri!";
        return;
      }

      if (foundUser.pass !== passInput.value) {
        passInput.classList.add('error');
        errDiv.innerText = "Parol noto'g'ri!";
        return;
      }

      // Muvaffaqiyatli kirish
      db.currentUser = foundUser;
      document.getElementById('page-login').classList.remove('active');
      document.getElementById('bottomNav').style.display = 'flex';
      switchPage('profile');
      loadProfileData();
    };

    function loadProfileData() {
      const u = db.currentUser;
      document.getElementById('headerNick').innerText = u.nick;
      
      const avatarImg = document.getElementById('myAvatar');
      if (u.avatar) {
        avatarImg.src = u.avatar;
        avatarImg.style.display = 'block';
      } else {
        avatarImg.style.display = 'none'; // Rasm qo'yilmagan bo'lsa hechnima bo'lsin
      }

      renderProfileGrid();
    }

    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (page === 'profile') {
        document.getElementById('page-profile').classList.add('active');
        document.getElementById('navProfileBtn').classList.add('active');
      } else if (page === 'reels') {
        document.getElementById('page-reels').classList.add('active');
        document.getElementById('navReelsBtn').classList.add('active');
        renderReelsFeed();
      }
    }

    // Material Yaratish
    function openCreateMenu() { document.getElementById('createMenu').style.display = 'block'; }
    function closeCreateMenu() { document.getElementById('createMenu').style.display = 'none'; }

    function startGeneration() {
      const type = document.getElementById('mediaType').value;
      const fileInput = document.getElementById('mediaFile');
      const caption = document.getElementById('mediaCaption').value;

      if (!fileInput.files[0]) {
        alert("Fayl tanlang!");
        return;
      }

      const file = fileInput.files[0];
      const isVideo = file.type.startsWith('video');

      if (type === 'reels' && !isVideo) {
        alert("Reels uchun faqat video qo'yish mumkin!");
        return;
      }
      if (type === 'post' && isVideo) {
        alert("Post uchun faqat rasm qo'yish mumkin!");
        return;
      }

      // Progress bar 1 dan 100 gacha
      const pBar = document.getElementById('progressBar');
      const pFill = document.getElementById('progressFill');
      const pText = document.getElementById('progressText');
      pBar.style.display = 'block';

      let count = 0;
      const interval = setInterval(() => {
        count++;
        pFill.style.width = count + '%';
        pText.innerText = count + '% yuklanmoqda...';

        if (count >= 100) {
          clearInterval(interval);
          pBar.style.display = 'none';
          pText.innerText = '';

          // Saqlash
          const mediaUrl = URL.createObjectURL(file);
          db.posts.unshift({
            id: Date.now(),
            user: db.currentUser,
            type: type,
            url: mediaUrl,
            caption: caption,
            likes: 0,
            comments: [],
            views: 0
          });

          closeCreateMenu();
          renderProfileGrid();
        }
      }, 20); // Tezlik
    }

    function renderProfileGrid() {
      const grid = document.getElementById('profileGrid');
      grid.innerHTML = '';

      const myPosts = db.posts.filter(p => p.user.nick === db.currentUser.nick);
      document.getElementById('postsCount').innerText = myPosts.length;

      myPosts.forEach(post => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        
        const logo = post.type === 'reels' ? '🎥' : '📷';
        
        let mediaHtml = post.type === 'reels' 
          ? `<video src="${post.url}"></video>`
          : `<img src="${post.url}">`;

        item.innerHTML = `
          ${mediaHtml}
          <div class="media-type-icon">${logo}</div>
        `;

        item.onclick = () => openFullView(post);
        grid.appendChild(item);
      });
    }

    // Instagram Full Media View modal
    function openFullView(post) {
      post.views++; // Ko'rilishlar soni ortadi
      const modal = document.getElementById('fullViewModal');
      const content = document.getElementById('fullViewContent');
      modal.style.display = 'flex';

      let mediaElement = post.type === 'reels'
        ? `<video src="${post.url}" controls class="post-media" autoplay loop></video>`
        : `<img src="${post.url}" class="post-media">`;

      content.innerHTML = `
        <div class="post-card">
          <div class="post-head">
            <div class="avatar-circle" style="width:32px; height:32px;">${post.user.avatar ? `<img src="${post.user.avatar}">` : ''}</div>
            <strong style="font-size:14px;">${post.user.nick}</strong>
          </div>
          ${mediaElement}
          <div class="post-actions">
            <span class="like-btn" id="likeBtn_${post.id}" onclick="toggleLike(${post.id})">❤️</span>
            <span onclick="addComment(${post.id})">💬</span>
          </div>
          <div class="comments-section">
            <div style="font-weight:bold; margin-bottom:5px;"><span id="likeCount_${post.id}">${post.likes}</span> ta layk • <span style="color:var(--text-muted);">${post.views} marta ko'rildi</span></div>
            <div><strong>${post.user.nick}</strong> ${post.caption}</div>
            <div id="commentList_${post.id}" style="margin-top:5px;">
              ${post.comments.map(c => `<div><strong>${c.user}:</strong> ${c.text}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function closeFullView() { document.getElementById('fullViewModal').style.display = 'none'; }

    function toggleLike(postId) {
      const post = db.posts.find(p => p.id === postId);
      if (post) {
        post.likes++;
        document.getElementById(`likeCount_${postId}`).innerText = post.likes;
      }
    }

    function addComment(postId) {
      const text = prompt("Izoh yozing:");
      if (text) {
        const post = db.posts.find(p => p.id === postId);
        post.comments.push({ user: db.currentUser.nick, text: text });
        openFullView(post); // Refresh View
      }
    }

    // Reels Feed (Barcha foydalanuvchilar va o'zining reels joyi)
    function renderReelsFeed() {
      const reelsFeed = document.getElementById('reelsFeed');
      reelsFeed.innerHTML = '';

      const allReels = db.posts.filter(p => p.type === 'reels');

      if (allReels.length === 0) {
        reelsFeed.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px;">Hozircha Reels yo'q</div>`;
        return;
      }

      allReels.forEach(reels => {
        const div = document.createElement('div');
        div.className = 'post-card';
        div.innerHTML = `
          <div class="post-head">
            <strong>${reels.user.nick}</strong>
          </div>
          <video src="${reels.url}" controls class="post-media" loop></video>
          <div class="post-actions">
            <span onclick="toggleLike(${reels.id})">❤️ ${reels.likes}</span>
          </div>
        `;
        reelsFeed.appendChild(div);
      });
    }
  </script>
</body>
</html>
