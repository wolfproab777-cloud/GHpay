<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Parol Topuvchi</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 0vh;
            margin: 0;
        }

        .container {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0  0 20px rgba(0, 255, 0, 0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            background-color: #000;
            color: #fff;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }

        button:hover {
            background-color: #00cc00;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 100px;
        }

        .character {
            display: inline-block;
            width: 20px;
            text-align: center;
            border-bottom: 2px solid #fff;
        }

        .current-char {
            color: #ffff00;
            font-weight: bold;
            font-size: 18px;
        }

        .success {
            color: #00ff00;
            font-weight: bold;
        }
        
        .loading {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Roblox Parol Topish</h2>
    <input type="text" id="nikName" placeholder="Roblox Nick nomini kiriting...">
    <button onclick="startFinding()">Topishni Boshlash</button>

    <div id="status">
        Status: Tayyor...
    </div>
    
    <div id="passwordDisplay" style="margin-top: 15px; font-size: 24px; letter-spacing: 5px;">
        <!-- Parol shu yerga chiqadi -->
    </div>
</div>

<script>
    let isRunning = false;

    function startFinding() {
        const nik = document.getElementById('nikName').value;
        const statusDiv = document.getElementById('status');
        const passwordDisplay = document.getElementById('passwordDisplay');

        if (!nik) {
            alert("Iltimos, Nick nomini kiriting!");
            return;
        }

        if (isRunning) return; // Agar allaqachon ishlayotgan bo'lsa, takror boshlamaydi
        isRunning = true;

        statusDiv.innerHTML = `Tizimga ulanish: <span class="loading">...</span>`;
        passwordDisplay.innerHTML = "";

        // Simulyatsiya: Ulanish jarayoni
        setTimeout(() => {
            statusDiv.innerHTML = `${nik} uchun parol topilmoqda...`;
            findPassword(nik);
        }, 1000);
    }

    async function findPassword(nik) {
        const passwordDisplay = document.getElementById('passwordDisplay');
        const statusDiv = document.getElementById('status');
        
        // Parol uzunligi (masalan, 6 ta belgi)
        const passwordLength = 6; 
        let currentPassword = "";

        for (let i = 0; i < passwordLength; i++) {
            let foundChar = false;
            
            // Har bir pozitsiya uchun harf va raqamlarni tekshirish
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            
            while (!foundChar) {
                // Tasodifiy belgi tanlash (simulyatsiya)
                const randomIndex = Math.floor(Math.random() * chars.length);
                const tempChar = chars[randomIndex];
                
                // Ekranda ko'rsatish (tez o'zgaruvchi effekt)
                passwordDisplay.innerHTML = currentPassword + `<span class="current-char">${tempChar}</span>`;
                
                // Tasodifiy vaqt kutish (qayerda harf, qayerda raqam ekanligini bilmaslik effekti)
                await new Promise(r => setTimeout(r, 50)); 

                // Agar tasodifiy tanlangan belgi "to'g'ri" deb hisoblansa (1/4 ehtimollik bilan tezroq topsin)
                if (Math.random() > 0.7) {
                    currentPassword += tempChar;
                    foundChar = true;
                    
                    // Ekranda qoldirish
                    passwordDisplay.innerHTML = currentPassword + `<span class="current-char">_</span>`;
                    await new Promise(r => setTimeout(r, 200));
                }
            }
        }

        // Yakuniy natija
        statusDiv.innerHTML = `<span class="success">${nik} uchun parol topildi!</span>`;
        passwordDisplay.innerHTML = currentPassword + " ✅";
        isRunning = false;
    }
</script>

</body>
</html>
