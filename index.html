<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghpat — Premium Social Network</title>
  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: #121215;
      --border-color: #27272a;
      --accent-color: #8b5cf6;
      --success-color: #22c55e;
      --error-color: #ef4444;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-screen {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      background: var(--bg-dark);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Bo'limlar boshqaruvi */
    .page {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px;
      padding-bottom: 80px;
    }

    .page.active {
      display: flex;
    }

    /* Sarlavhalar va Kirish elementlari */
    h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: block;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: all 0.3s;
    }

    input.valid {
      border-color: var(--success-color) !important;
    }

    input.invalid {
      border-color: var(--error-color) !important;
    }

    .validation-msg {
      font-size: 12px;
      margin-top: 5px;
    }
    .msg-error { color: var(--error-color); }
    .msg-success { color: var(--success-color); }

    /* Tugmalar */
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-google {
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* Rasm yuklash (Avatar) */
    .avatar-upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 30px 0;
    }

    .avatar-wrapper {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px dashed var(--accent-color);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
      background: var(--card-bg);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .plus-icon {
      font-size: 36px;
      color: var(--accent-color);
    }

    .skip-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 15px;
      font-size: 14px;
      text-decoration: underline;
    }

    /* Spinner (Aylanadigan Loader) */
    .spinner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid var(--border-color);
      border-top: 5px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Pastki qotib turuvchi menyu (Navbar) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 450px;
      background: rgba(18, 18, 21, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 12px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--accent-color);
      font-weight: bold;
    }

    /* Instagram formatidagi Profil sahifasi */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--accent-color);
      object-fit: cover;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .profile-username {
      font-size: 18px;
      font-weight: bold;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 20px;
    }

    .post-item {
      aspect-ratio: 1;
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .post-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Nastroyka (Settings) ko'rinishi */
    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border-color);
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- Spinner (Aylanadigan Loader) -->
    <div class="spinner-overlay" id="spinner">
      <div class="spinner"></div>
      <p style="margin-top: 15px; font-size: 14px; color: var(--text-muted);">Ma'lumotlar saqlanmoqda...</p>
    </div>

    <!-- 1-SAHIFA: Google orqali Kirish va Akkaunt yaratish -->
    <div class="page active" id="page-register">
      <h2>Ghpat’ga Kirish</h2>
      
      <button class="btn btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google orqali kiring
      </button>

      <div class="form-group">
        <label>Email adressingiz</label>
        <input type="email" id="emailInput" placeholder="example@gmail.com">
      </div>

      <div class="form-group">
        <label>Nikingiz (Username)</label>
        <input type="text" id="usernameInput" placeholder="nik_1234">
        <div class="validation-msg" id="usernameMsg"></div>
      </div>

      <div class="form-group">
        <label>Parolingiz</label>
        <input type="password" id="passwordInput" placeholder="Kamida 9 ta belgi">
        <div class="validation-msg" id="passwordMsg"></div>
      </div>

      <button class="btn" id="nextToAvatarBtn" disabled>Keyingisi</button>
    </div>

    <!-- 2-SAHIFA: Profil Rasmi Qo'yish -->
    <div class="page" id="page-avatar">
      <h2>Profil Rasmi</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Profiligiz uchun rasm tanlang</p>

      <div class="avatar-upload-container">
        <div class="avatar-wrapper" id="avatarBox">
          <span class="plus-icon" id="plusIcon">+</span>
          <img id="avatarPreview" src="" alt="Avatar">
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <button class="skip-btn" id="skipAvatarBtn">O'tkazib yuborish</button>
      </div>

      <button class="btn" id="finishRegBtn">Boshlash (Bo'ldi)</button>
    </div>

    <!-- 3-SAHIFA: Bosh Menu (Feed) -->
    <div class="page" id="page-feed">
      <h2>Bosh Menu</h2>
      <div style="background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center;">
        🎉 Ghpat platformasiga xush kelibsiz!
      </div>
    </div>

    <!-- 4-SAHIFA: Profil Sahifasi (Instagram Style) -->
    <div class="page" id="page-profile">
      <div class="profile-header">
        <img src="https://via.placeholder.com/150" class="profile-avatar" id="profilePageAvatar" alt="Profil">
        <div class="profile-info">
          <div class="profile-username" id="profilePageUsername">User</div>
          <span style="font-size: 12px; color: var(--text-muted);" id="profilePageEmail">email@gmail.com</span>
        </div>
      </div>

      <p style="margin-top: 15px; font-weight: bold; font-size: 14px;">Mening Postlarim & Reels</p>
      <div class="posts-grid">
        <div class="post-item"><img src="https://picsum.photos/200/200?random=1" alt="post"></div>
        <div class="post-item"><img src="https://picsum.photos/200/200?random=2" alt="post"></div>
        <div class="post-item"><img src="https://picsum.photos/200/200?random=3" alt="post"></div>
      </div>
    </div>

    <!-- 5-SAHIFA: Nastroyka (Settings) -->
    <div class="page" id="page-settings">
      <h2>Sozlamalar</h2>

      <div class="setting-item">
        <span>Ovozni pasaytirish</span>
        <label class="switch">
          <input type="checkbox" id="lowVolumeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <span>Ovozni ochirish (Mute)</span>
        <label class="switch">
          <input type="checkbox" id="muteToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Pastda qotib turuvchi Bosh Menyu (Navigation) -->
    <nav class="bottom-nav" id="bottomNav" style="display: none;">
      <button class="nav-item active" onclick="switchTab('feed', this)">
        <span>🏠</span>
        <span>Bosh Menu</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile', this)">
        <span>👤</span>
        <span>Profil</span>
      </button>
      <button class="nav-item" onclick="switchTab('settings', this)">
        <span>⚙️</span>
        <span>Nastroyka</span>
      </button>
    </nav>

  </div>

  <script>
    // Mavjud Niklar ro'yxati (Band bo'lgan niklarni simulyatsiya qilish uchun)
    const existingUsernames = ["ali_1234", "admin_9999", "user_7777", "sardor.0000"];

    // Elementlar
    const emailInput = document.getElementById('emailInput');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const usernameMsg = document.getElementById('usernameMsg');
    const passwordMsg = document.getElementById('passwordMsg');
    const nextToAvatarBtn = document.getElementById('nextToAvatarBtn');

    const avatarBox = document.getElementById('avatarBox');
    const fileInput = document.getElementById('fileInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const plusIcon = document.getElementById('plusIcon');
    const finishRegBtn = document.getElementById('finishRegBtn');
    const skipAvatarBtn = document.getElementById('skipAvatarBtn');
    const spinner = document.getElementById('spinner');

    let uploadedAvatarUrl = "https://i.pravatar.cc/150?img=12"; // Default avatar

    // Google bilan kirish tugmasi
    document.getElementById('googleBtn').addEventListener('click', () => {
      emailInput.value = "wolfproab777@gmail.com";
      checkEmailAndSetNick();
      validateForm();
    });

    emailInput.addEventListener('input', checkEmailAndSetNick);

    function checkEmailAndSetNick() {
      // Maxsus Pochta sharti
      if (emailInput.value.trim().toLowerCase() === "wolfproab777@gmail.com") {
        usernameInput.value = "GHPAT OFFICIAL";
        usernameInput.disabled = true; // Avto qoyilgach o'zgartirib bo'lmaydi
      } else {
        usernameInput.disabled = false;
      }
      validateForm();
    }

    // Validatsiya mantiqlari
    usernameInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', validateForm);

    function validateForm() {
      const username = usernameInput.value;
      const password = passwordInput.value;
      let isUsernameValid = false;
      let isPasswordValid = false;

      // 1. Nik Tekshiruvlari
      const hasMinLetters = (username.match(/[a-zA-Z]/g) || []).length > 4; // 4 ta harfdan kop
      const hasSpecialChar = /[_\-.,]/.test(username); // _ - . , borligi
      const digitCount = (username.match(/\d/g) || []).length;
      const hasMinDigits = digitCount > 3; // 3 ta sondan kop
      const isForbiddenWord = username.toUpperCase().includes("GHPAT ADMIN");
      const isAlreadyTaken = existingUsernames.includes(username.toLowerCase());

      if (username === "GHPAT OFFICIAL") {
        // Maxsus nik uchun istisno
        isUsernameValid = true;
        usernameInput.className = "valid";
        usernameMsg.className = "validation-msg msg-success";
        usernameMsg.innerText = "Tasdiqlangan Rasmiy Nik!";
      } else if (isForbiddenWord) {
        usernameInput.className = "invalid";
        usernameMsg.className = "validation-msg msg-error";
        usernameMsg.innerText = "'GHPAT ADMIN' so'zini ishlatish taqiqlangan!";
      } else if (isAlreadyTaken) {
        usernameInput.className = "invalid";
        usernameMsg.className = "validation-msg msg-error";
        usernameMsg.innerText = "Bu nik allaqachon mavjud (Band)!";
      } else if (hasMinLetters && hasSpecialChar && hasMinDigits) {
        usernameInput.className = "valid";
        usernameMsg.className = "validation-msg msg-success";
        usernameMsg.innerText = "Nik mos keldi (Mavjud emas - Yashil)";
        isUsernameValid = true;
      } else {
        usernameInput.className = "invalid";
        usernameMsg.className = "validation-msg msg-error";
        usernameMsg.innerText = "Nikda >4 harf, >3 son va (_, - . ,) belgilar bo'lishi kerak!";
      }

      // 2. Parol Tekshiruvi (8 ta belgi yoki sondan kop = kamida 9)
      if (password.length > 8) {
        passwordInput.className = "valid";
        passwordMsg.className = "validation-msg msg-success";
        passwordMsg.innerText = "Parol to'g'ri";
        isPasswordValid = true;
      } else {
        passwordInput.className = "invalid";
        passwordMsg.className = "validation-msg msg-error";
        passwordMsg.innerText = "Parol 8 ta belgidan ko'p bo'lishi kerak!";
      }

      // Tugmani yoqish
      nextToAvatarBtn.disabled = !(isUsernameValid && isPasswordValid);
    }

    // Sahifa o'tkazish
    nextToAvatarBtn.addEventListener('click', () => {
      showPage('page-avatar');
    });

    // Avatar yuklash
    avatarBox.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          uploadedAvatarUrl = event.target.result;
          avatarPreview.src = uploadedAvatarUrl;
          avatarPreview.style.display = 'block';
          plusIcon.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    });

    // Registratsiyani yakunlash (Bo'ldi tugmasi)
    finishRegBtn.addEventListener('click', finalizeRegistration);
    skipAvatarBtn.addEventListener('click', finalizeRegistration);

    function finalizeRegistration() {
      // Spinnerni chiqarish
      spinner.style.display = 'flex';

      setTimeout(() => {
        spinner.style.display = 'none';

        // Profil ma'lumotlarini to'ldirish
        document.getElementById('profilePageUsername').innerText = usernameInput.value;
        document.getElementById('profilePageEmail').innerText = emailInput.value || "wolfproab777@gmail.com";
        document.getElementById('profilePageAvatar').src = uploadedAvatarUrl;

        // Bosh menyuga o'tish
        document.getElementById('bottomNav').style.display = 'flex';
        showPage('page-feed');
      }, 2000); // 2 soniya aylanadi
    }

    // Navigatsiya Boshqaruvi
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      if (tabName === 'feed') showPage('page-feed');
      if (tabName === 'profile') showPage('page-profile');
      if (tabName === 'settings') showPage('page-settings');
    }
  </script>
</body>
</html>
