<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Lookup System</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #1a1a1a;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.1);
            border: 1px solid #333;
        }

        h2 {
            text-align: center;
            color: #00ff00;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 2px solid #333;
            color: #fff;
            font-size: 18px;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #00ff00;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #00ff00;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #00cc00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
        }

        /* Natija qismi dizayni */
        #resultArea {
            margin-top: 25px;
            display: none; /* Boshida yashirin */
            border-top: 1px dashed #333;
            padding-top: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .label {
            color: #888;
        }

        .value {
            color: #fff;
            font-weight: bold;
            text-align: right;
            max-width: 60%;
        }

        .telegram-status {
            color: #2196F3; /* Telegram rangi */
        }
        
        .not-found {
            color: #ff4444;
        }

        .loading {
            text-align: center;
            color: #00ff00;
            display: none;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Phone Lookup</h2>
    
    <div class="input-group">
        <input type="tel" id="phoneInput" placeholder="+998 90 123 45 67" autocomplete="off">
    </div>

    <button onclick="lookupPhone()">Qidirish</button>

    <div class="loading" id="loadingText">Ma'lumotlar bazasida qidirilmoqda...</div>

    <div id="resultArea">
        <!-- Natijalar shu yerga tushadi -->
        <div class="data-row">
            <span class="label">Operator:</span>
            <span class="value" id="resOperator">--</span>
        </div>
        <div class="data-row">
            <span class="label">Lokatsiya:</span>
            <span class="value" id="resLocation">--</span>
        </div>
        <div class="data-row">
            <span class="label">Telegram:</span>
            <span class="value telegram-status" id="resTelegram">--</span>
        </div>
        <div class="data-row">
            <span class="label">Gmail (Ehtimol):</span>
            <span class="value" id="resGmail">--</span>
        </div>
    </div>
</div>

<script>
    function lookupPhone() {
        const input = document.getElementById('phoneInput').value;
        const resultArea = document.getElementById('resultArea');
        const loading = document.getElementById('loadingText');
        
        if(input.length < 9) {
            alert("Iltimos, to'liq raqamni kiriting!");
            return;
        }

        // UI ni yangilash
        resultArea.style.display = 'none';
        loading.style.display = 'block';

        // Simulyatsiya: 1.5 soniya kutish (Serverga so'rov ketayotgandek)
        setTimeout(() => {
            loading.style.display = 'none';
            resultArea.style.display = 'block';

            // --- LOGIKA QISMI ---
            
            // 1. Operatorni aniqlash (Prefix asosida)
            let operator = "Noma'lum";
            if (input.includes("90")) operator = "Ucell";
            else if (input.includes("93") || input.includes("94")) operator = "Beeline";
            else if (input.includes("91") || input.includes("95")) operator = "Mobiuz";
            else if (input.includes("97")) operator = "UMS";

            // 2. Telegram tekshirish (Random)
            let tgStatus = "";
            const isTg = Math.random() > 0.3; // 70% ehtimol bilan topiladi
            
            if (isTg) {
                tgStatus = `<span style="color:#2196F3">✅ Bor (@user_${input.slice(4)})</span>`;
            } else {
                tgStatus = `<span class="not-found">❌ Topilmadi</span>`;
            }

            // 3. Gmail yaratish (Raqam asosida)
            let cleanNum = input.replace(/[^0-9]/g, ''); // Faqat raqamlarni olib tashlash
            let gmail = `${cleanNum}@gmail.com`;

            // 4. Lokatsiya (Random tanlash)
            const cities = ["Toshkent", "Samarqand", "Buxoro", "Andijon", "Farg'ona"];
            const randomCity = cities[Math.floor(Math.random() * cities.length)];

            // Natijalarni ekranga chiqarish
            document.getElementById('resOperator').innerText = operator;
            document.getElementById('resLocation').innerText = randomCity;
            document.getElementById('resTelegram').innerHTML = tgStatus;
            document.getElementById('resGmail').innerText = gmail;

        }, 1500); // 1.5 soniya kutish
    }
</script>

</body>
</html>
